# Publishes the playable build to Cloudflare Pages (works with a private repo): https://taiho.pages.dev
# Uses the same CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets as the Worker deploy; the token needs
# "Cloudflare Pages: Edit" as well. VITE_API_URL is an optional repository variable pointing at the Worker.
name: Deploy Web (Cloudflare Pages)
on:
  push:
    branches: [master, main, game/scaffold]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      - name: Create the Pages project on first run
        run: npx wrangler@3 pages project create taiho --production-branch game/scaffold || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Publish dist/
        run: npx wrangler@3 pages deploy dist --project-name taiho --branch game/scaffold --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
