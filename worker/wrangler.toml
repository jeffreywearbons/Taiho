name = "taiho-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "taiho"
database_id = "REPLACE_WITH_YOUR_D1_ID"

[vars]
ALLOWED_ORIGIN = "*"
# Sign in with Apple: your app's bundle id (and the Services ID for web). Google: OAuth client ids. Comma-separated.
APPLE_AUDIENCES = ""
GOOGLE_AUDIENCES = ""
